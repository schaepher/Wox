name: Build

on:
  push:
    branches:
      - master
  # Allow building on demand from the fork's Actions tab, for example to rebuild
  # Windows without pushing a new commit to master.
  workflow_dispatch:

# A reusable workflow cannot be granted more scopes than its caller, so mirror the
# scopes build-core.yml declares (attestation needs id-token/attestations write).
permissions:
  contents: read
  actions: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  # The previous fork-local job ran the Flutter/just release flow, which no longer
  # exists after rebasing onto upstream master (there is no justfile and the UI is
  # native now). Delegate to the maintained reusable workflow instead: it owns the
  # Windows toolchain (MSYS2 mingw, i686 compiler for the 32-bit window hook, Go,
  # Node, Python) and uploads release/wox-windows-amd64.exe as an artifact.
  build-windows:
    uses: ./.github/workflows/build-core.yml
    with:
      # Tests run on ubuntu-latest and are not what this fork build is about, so skip
      # them to keep the Windows build quick. Flip to true to gate on the full suite.
      run_tests: false
      build_macos_arm64: false
      build_macos_amd64: false
      build_windows_amd64: true
      build_linux_amd64: false
      # No signing credentials exist on this fork; build unsigned.
      require_macos_notarize: false
      require_windows_signpath: false
      artifact_retention_days: 10
    secrets: inherit

  # Keep the fork's original intent ("release to my repo"): each green master build
  # publishes a downloadable Windows binary here instead of only inside a workflow run.
  publish-nightly:
    name: Publish nightly Windows build
    needs: build-windows
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: wox-windows-amd64.exe

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The asset name is stable, so --clobber replaces the previous nightly build
          # instead of failing on the duplicate name.
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly wox-windows-amd64.exe --clobber
          else
            gh release create nightly wox-windows-amd64.exe \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Nightly build" \
              --notes "Automated build of master. Windows amd64 (unsigned) only."
          fi
