name: Build

on:
  push:
    branches:
      - master
  # Allow building on demand from the fork's Actions tab, for example to rebuild
  # one platform without pushing a new commit to master.
  workflow_dispatch:

# A reusable workflow cannot be granted more scopes than its caller, so mirror the
# scopes build-core.yml declares (attestation needs id-token/attestations write).
permissions:
  contents: read
  actions: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  # Windows amd64, macOS arm64/amd64 and Linux amd64 come from the maintained
  # reusable workflow: it owns each platform's toolchain (MSYS2 mingw and the
  # i686 window-hook compiler on Windows, create-dmg on macOS, GTK/X11 on
  # Linux) and uploads one artifact per package.
  build:
    uses: ./.github/workflows/build-core.yml
    with:
      # Tests run on ubuntu-latest and are not what this nightly build is about;
      # they only delay the artifacts. Flip to true to gate on the full suite.
      run_tests: false
      build_macos_arm64: true
      build_macos_amd64: true
      build_windows_amd64: true
      build_linux_amd64: true
      # No signing credentials exist on this fork; build unsigned.
      require_macos_notarize: false
      require_windows_signpath: false
      artifact_retention_days: 10
    secrets: inherit

  # build-core has no Linux arm64 job: its Linux path only ever runs on the
  # amd64 host, and wox.core/Makefile hardcodes ARCH=amd64 for Linux. Instead of
  # cross-compiling a whole aarch64 GTK/X11 sysroot, build natively on the arm64
  # runner (free for public repositories) and pass ARCH/GOARCH on the command
  # line, which overrides the Makefile defaults.
  build-linux-arm64:
    name: Build Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          # patchelf is required by _check_deps on Linux and is not guaranteed to
          # be preinstalled on the arm64 runner image, unlike ubuntu-latest.
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libgtk-3-dev \
            libpipewire-0.3-dev \
            libblkid-dev \
            liblzma-dev \
            libsecret-1-dev \
            libglib2.0-dev \
            libgirepository1.0-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcursor-dev \
            libxtst-dev \
            libkeybinder-3.0-dev \
            libgtk-layer-shell0 \
            patchelf \
            rpm \
            xvfb

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: wox.core/go.mod
          cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      - name: Download appimagetool (aarch64)
        run: |
          curl -L -o appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool.AppImage

      # APPIMAGE_EXTRACT_AND_RUN keeps appimagetool usable without FUSE; the
      # runner has no /dev/fuse for the arm64 image. APPIMAGE_ARCH is passed
      # explicitly because AppImageKit expects aarch64, not arm64.
      - name: Build
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: xvfb-run -a make build ARCH=arm64 GOARCH=arm64 APPIMAGE_ARCH=aarch64 APPIMAGE_TOOL=./appimagetool.AppImage

      - name: Attest build provenance
        uses: actions/attest@v4
        with:
          subject-path: ./release/wox-linux-arm64

      - name: Attest AppImage provenance
        uses: actions/attest@v4
        with:
          subject-path: ./release/wox-linux-arm64.AppImage

      - name: Attest deb provenance
        uses: actions/attest@v4
        with:
          subject-path: ./release/wox-linux-arm64.deb

      - name: Attest rpm provenance
        uses: actions/attest@v4
        with:
          subject-path: ./release/wox-linux-arm64.rpm

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wox-linux-arm64
          path: ./release/wox-linux-arm64

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: wox-linux-arm64.AppImage
          path: ./release/wox-linux-arm64.AppImage

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: wox-linux-arm64.deb
          path: ./release/wox-linux-arm64.deb

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v7
        with:
          name: wox-linux-arm64.rpm
          path: ./release/wox-linux-arm64.rpm

  # Keep the fork's original intent ("release to my repo"): each green master
  # build publishes a downloadable binary per platform here instead of only
  # inside a workflow run.
  publish-nightly:
    name: Publish nightly build
    needs: [build, build-linux-arm64]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job only downloads artifacts, so there is no checkout for gh to
          # infer the repository from; name it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(artifacts/*/*)
          test ${#files[@]} -gt 0 || { echo "no artifacts downloaded" >&2; exit 1; }
          # Asset names are stable, so --clobber replaces the previous nightly
          # build instead of failing on the duplicate names.
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly "${files[@]}" --clobber
          else
            gh release create nightly "${files[@]}" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Nightly build" \
              --notes "Automated build of master: Windows amd64, macOS arm64/amd64, Linux amd64/arm64. All packages are unsigned."
          fi
